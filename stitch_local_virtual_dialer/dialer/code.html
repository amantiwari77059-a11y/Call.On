<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .dial-ripple {
            position: relative;
            overflow: hidden;
        }
        .dial-ripple::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .dial-ripple:active::after {
            transform: scale(0, 0);
            opacity: .3;
            transition: 0s;
        }
    </style>

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm z-50">
<div class="flex items-center justify-between px-md py-sm w-full max-w-container-max mx-auto h-16">

</div>
<div class="flex flex-col">
<span class="font-display-lg text-headline-md-mobile md:text-display-lg tracking-tight text-secondary dark:text-secondary-fixed">VoIP Connect</span>
<div class="flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-on-tertiary-container"></span>
<span class="text-[10px] uppercase font-bold text-on-tertiary-container tracking-wider">Connected • HD Audio</span>
</div>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content: Dialer Screen -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter pb-32">
<div class="w-full max-w-md mx-auto flex flex-col items-center">
<!-- Number Display Area -->
<div class="w-full mb-12 text-center">
<div class="h-20 flex items-center justify-center">
<span class="font-call-number text-call-number text-on-surface tracking-widest empty:after:content-['\00a0']" id="number-display"></span>
</div>
<div class="h-6 text-on-surface-variant font-body-md opacity-0 transition-opacity duration-300" id="contact-preview">
                    Searching contacts...
                </div>
</div>
<!-- 3x4 Numeric Keypad -->
<div class="grid grid-cols-3 gap-y-6 gap-x-8 w-full">
<!-- Row 1 -->
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200 group" onclick="appendNumber('1')">
<span class="font-call-number text-call-number text-on-surface">1</span>
<span class="text-[10px] font-bold text-outline uppercase invisible">.</span>
</button>
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200 group" onclick="appendNumber('2')">
<span class="font-call-number text-call-number text-on-surface">2</span>
<span class="text-[10px] font-bold text-outline uppercase">ABC</span>
</button>
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200 group" onclick="appendNumber('3')">
<span class="font-call-number text-call-number text-on-surface">3</span>
<span class="text-[10px] font-bold text-outline uppercase">DEF</span>
</button>
<!-- Row 2 -->
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('4')">
<span class="font-call-number text-call-number text-on-surface">4</span>
<span class="text-[10px] font-bold text-outline uppercase">GHI</span>
</button>
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('5')">
<span class="font-call-number text-call-number text-on-surface">5</span>
<span class="text-[10px] font-bold text-outline uppercase">JKL</span>
</button>
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('6')">
<span class="font-call-number text-call-number text-on-surface">6</span>
<span class="text-[10px] font-bold text-outline uppercase">MNO</span>
</button>
<!-- Row 3 -->
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('7')">
<span class="font-call-number text-call-number text-on-surface">7</span>
<span class="text-[10px] font-bold text-outline uppercase">PQRS</span>
</button>
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('8')">
<span class="font-call-number text-call-number text-on-surface">8</span>

</button>
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('9')">
<span class="font-call-number text-call-number text-on-surface">9</span>
<span class="text-[10px] font-bold text-outline uppercase">WXYZ</span>
</button>
<!-- Row 4 -->
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('*')">
<span class="font-call-number text-call-number text-on-surface">*</span>
</button>
<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('0')">
<span class="font-call-number text-call-number text-on-surface">0</span>
<span class="text-[10px] font-bold text-outline uppercase">+</span>

<button class="dial-ripple flex flex-col items-center justify-center w-20 h-20 mx-auto rounded-full bg-surface-container-low hover:bg-surface-container-high active:scale-90 transition-all duration-200" onclick="appendNumber('#')">

<div class="mt-12 flex items-center justify-center w-full relative">

</div>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-sm pb-safe bg-surface dark:bg-surface-container border-t border-outline-variant shadow-lg">
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dialpad</span>
<span class="font-label-md text-label-md">Dialer</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-secondary dark:hover:text-secondary-fixed-dim active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant hover:text-secondary dark:hover:text-secondary-fixed-dim active:scale-90 transition-transform duration-200" href="#">

<span class="font-label-md text-label-md">Contacts</span>
</a>

<span class="font-label-md text-label-md">Numbers</span>
</a>

<!-- Call Overlay (Hidden by default) -->
<div class="fixed inset-0 bg-primary-container/95 z-[60] flex flex-col items-center justify-between py-24 px-gutter hidden transform transition-transform duration-500 translate-y-full" id="call-overlay">
<div class="text-center">
<div class="w-32 h-32 mx-auto rounded-full bg-secondary-container/20 flex items-center justify-center mb-8 border-2 border-secondary-container/30">
<span class="material-symbols-outlined text-secondary-fixed-dim text-6xl">person</span>
</div>
<h2 class="text-white font-display-lg text-display-lg mb-2" id="calling-number"></h2>
<p class="text-secondary-fixed-dim font-body-lg uppercase tracking-widest">Calling...</p>
</div>
<div class="flex gap-12">
<button class="w-20 h-20 rounded-full bg-error text-white shadow-xl flex items-center justify-center active:scale-90 hover:brightness-110 transition-all" onclick="endCall()">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
</div>
</div>
<script>
        const display = document.getElementById('number-display');
        const preview = document.getElementById('contact-preview');
        const overlay = document.getElementById('call-overlay');
        const callingNumber = document.getElementById('calling-number');
        let currentNumber = "";

        function formatNumber(num) {
            if (num.length === 0) return "";
            if (num.startsWith('*') || num.startsWith('#')) return num;
            
            const cleaned = ('' + num).replace(/\D/g, '');
            const match = cleaned.match(/^(\d{3})(\d{3})(\d{4})$/);
            if (match) {
                return `(${match[1]}) ${match[2]}-${match[3]}`;
            }
            return num;
        }

        function appendNumber(n) {
            if (currentNumber.length < 15) {
                currentNumber += n;
                display.innerText = formatNumber(currentNumber);
                
                // Mock contact searching effect
                if (currentNumber.length > 3) {
                    preview.style.opacity = "1";
                }
                
                // Play subtle DTMF tone simulation (visual only here)
                vibrate(10);
            }
        }

        function deleteNumber() {
            currentNumber = currentNumber.slice(0, -1);
            display.innerText = formatNumber(currentNumber);
            if (currentNumber.length <= 3) {
                preview.style.opacity = "0";
            }
        }

        function startCall() {
            if (currentNumber.length > 0) {
                callingNumber.innerText = formatNumber(currentNumber);
                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('translate-y-full');
                }, 10);
            }
        }

        function endCall() {
            overlay.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                currentNumber = "";
                display.innerText = "";
                preview.style.opacity = "0";
            }, 500);
        }

        function vibrate(ms) {
            if (navigator.vibrate) {
                navigator.vibrate(ms);
            }
        }

        // Long press on 0 for +
        let zeroTimer;
        const zeroBtn = document.querySelector('button[onclick="appendNumber(\'0\')"]');
        zeroBtn.addEventListener('mousedown', () => {
            zeroTimer = setTimeout(() => {
                currentNumber = currentNumber.slice(0, -1) + "+";
                display.innerText = formatNumber(currentNumber);
            }, 800);
        });
        zeroBtn.addEventListener('mouseup', () => clearTimeout(zeroTimer));
        zeroBtn.addEventListener('mouseleave', () => clearTimeout(zeroTimer));
    </script>
</body></html>
